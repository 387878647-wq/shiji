<style>

<body>
<header class="wrap topbar">
  <a class="brand" href="#top" aria-label="拾集首页">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2-2A5 5 0 0 0 12 3.93l-1.15 1.15"/><path d="M14 11a5 5 0 0 0-7.07 0l-2 2A5 5 0 0 0 12 20.07l1.15-1.15"/></svg></div>
    <div><div class="brand-name">拾集</div><div class="brand-sub">LINKS · FILES · IMAGES</div></div>
  </a>
  <div class="top-right"><div class="local-pill"><span class="dot"></span>仅保存在当前浏览器</div><button class="btn btn-primary" id="openAddTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加资源</button></div>
</header>
<main class="wrap" id="top">
  <section class="hero">
    <div><div class="eyebrow">YOUR PERSONAL LIBRARY</div><h1>值得保存的，<br>都放在这里。</h1><p>链接、图片、文件，一个顺手的小收藏站。把散落在各处的好东西收拢起来，想找的时候，一搜就有。</p></div>
    <div class="hero-side" aria-label="资源统计"><div class="stat"><strong id="totalCount">0</strong><span>全部资源</span></div><div class="stat"><strong id="linkCount">0</strong><span>网址链接</span></div><div class="stat"><strong id="fileCount">0</strong><span>文件与图片</span></div></div>
  </section>
  <section class="panel" aria-label="资源列表工具栏">
    <div class="toolbar-top">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg><input id="searchInput" type="search" placeholder="搜索标题、网址、文件名…" autocomplete="off" aria-label="搜索资源"></div>
      <select id="sortSelect" class="sort-select" aria-label="排序方式"><option value="new">最新添加</option><option value="old">最早添加</option><option value="az">名称 A-Z</option></select>
    </div>
    <div class="tabs" role="tablist" aria-label="资源类型">
      <button class="tab active" data-filter="all" role="tab" aria-selected="true">全部<span class="tab-count" id="countAll">0</span></button>
      <button class="tab" data-filter="link" role="tab" aria-selected="false">↗ 链接<span class="tab-count" id="countLink">0</span></button>
      <button class="tab" data-filter="image" role="tab" aria-selected="false">▧ 图片<span class="tab-count" id="countImage">0</span></button>
      <button class="tab" data-filter="file" role="tab" aria-selected="false">▤ 文件<span class="tab-count" id="countFile">0</span></button>
    </div>
  </section>
  <div class="result-row"><div><div class="result-title" id="resultTitle">所有资源</div><div class="result-note" id="resultNote">你的私人收藏空间，整洁又好找。</div></div><div class="view-toggle" aria-label="视图模式"><button class="active" id="gridMode" aria-label="网格视图" title="网格视图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button><button id="listMode" aria-label="列表视图" title="列表视图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01" stroke-width="3"/></svg></button></div></div>
  <section class="grid" id="resourceGrid" aria-live="polite"></section>
  <footer class="footer"><div>© <span id="year"></span> <strong>拾集</strong> · 好东西，值得被好好收藏。</div><div class="footer-links"><span>本地保存 · 不上传服务器</span><button id="helpButton">使用说明</button></div></footer>
</main>

<div class="overlay" id="addOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
 <div class="modal">
  <div class="modal-head"><div><h2 id="modalTitle">添加到拾集</h2><p>选择一种类型，把它收进你的资源库。</p></div><button class="close-btn" id="closeModal" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div>
  <div class="type-select" role="tablist"><button type="button" class="type-choice active" data-type="link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.07 0l2-2A5 5 0 0 0 12 3.93l-1.15 1.15"/><path d="M14 11a5 5 0 0 0-7.07 0l-2 2A5 5 0 0 0 12 20.07l1.15-1.15"/></svg>网址链接</button><button type="button" class="type-choice" data-type="image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>图片</button><button type="button" class="type-choice" data-type="file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>文件</button></div>
  <form id="addForm">
   <div id="linkFields">
    <div class="field"><label for="urlInput">网址 *</label><input type="text" inputmode="url" id="urlInput" placeholder="https://example.com" autocomplete="url" autocapitalize="off" spellcheck="false"><div class="hint">输入网址即可，可带或不带 https://，保存时会自动补全。</div></div>
    <div class="field"><label for="linkTitle">标题（选填）</label><input id="linkTitle" type="text" maxlength="120" placeholder="给这个链接起个名字"></div>
   </div>
   <div id="uploadFields" class="hidden">
    <div class="field"><label id="uploadLabel">选择图片 *</label><label class="dropzone" id="dropzone" for="fileInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M20 16.5v3A1.5 1.5 0 0 1 18.5 21h-13A1.5 1.5 0 0 1 4 19.5v-3"/></svg><strong>点击选择，或把文件拖到这里</strong><span id="uploadHint">支持常见图片格式，可一次选择多张</span><input type="file" id="fileInput" multiple accept="image/*"></label><div class="selected-files" id="selectedFiles" aria-live="polite"></div></div>
   </div>
   <div class="field"><label for="descriptionInput">备注（选填）</label><textarea id="descriptionInput" maxlength="500" placeholder="写点备注，方便以后找到它…"></textarea></div>
   <div class="modal-actions"><button type="button" class="btn btn-plain" id="cancelModal">取消</button><button type="submit" class="btn btn-primary" id="saveButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>保存资源</button></div>
   <div class="note">提示：内容保存在这台设备的当前浏览器中。清理浏览器数据或更换设备可能导致内容丢失。</div>
  </form>
 </div>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览"><button class="close-btn" id="closeLightbox" aria-label="关闭图片预览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 6-12 12M6 6l12 12"/></svg></button><img id="lightboxImage" alt="图片大图预览"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  'use strict';
  const DB_NAME = 'shiji-resource-library';
  const STORE_NAME = 'resources';
  let db = null;
  let items = [];
  let activeType = 'link';
  let activeFilter = 'all';
  let listView = false;
  let selectedFiles = [];
  let toastTimer = null;
  const objectUrls = new Map();
  const $ = (id) => document.getElementById(id);
  const svg = {
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2-2A5 5 0 0 0 12 3.93l-1.15 1.15"/><path d="M14 11a5 5 0 0 0-7.07 0l-2 2A5 5 0 0 0 12 20.07l1.15-1.15"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 17v3h14v-3"/></svg>'
  };

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('当前浏览器不支持本地存储'));
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) database.createObjectStore(STORE_NAME, { keyPath: 'id' });
      };
      request.onsuccess = () => { db = request.result; resolve(db); };
      request.onerror = () => reject(request.error || new Error('无法打开本地数据库'));
    });
  }
  function storeRequest(mode, method, value) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, mode);
      const store = tx.objectStore(STORE_NAME);
      let request;
      try { request = value === undefined ? store[method]() : store[method](value); }
      catch (err) { reject(err); return; }
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('操作失败'));
    });
  }
  const getAll = () => storeRequest('readonly', 'getAll');
  const putItem = (item) => storeRequest('readwrite', 'put', item);
  const removeItem = (id) => storeRequest('readwrite', 'delete', id);
  function uid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function escapeHTML(value) { return String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function formatDate(timestamp) { try { return new Intl.DateTimeFormat('zh-CN', {month:'short',day:'numeric'}).format(new Date(timestamp)); } catch (_) { return ''; } }
  function formatSize(bytes) {
    if (!Number.isFinite(bytes) || bytes < 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10240 ? 1 : 0) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }
  function getObjectUrl(item) {
    if (!item.blob) return '';
    if (!objectUrls.has(item.id)) objectUrls.set(item.id, URL.createObjectURL(item.blob));
    return objectUrls.get(item.id);
  }
  function showToast(message) {
    const node = $('toast'); node.textContent = message; node.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove('show'), 2800);
  }
  function stats() {
    const links = items.filter(x => x.type === 'link').length;
    const images = items.filter(x => x.type === 'image').length;
    const files = items.filter(x => x.type === 'file').length;
    $('totalCount').textContent = items.length;
    $('linkCount').textContent = links;
    $('fileCount').textContent = images + files;
    $('countAll').textContent = items.length;
    $('countLink').textContent = links;
    $('countImage').textContent = images;
    $('countFile').textContent = files;
  }
  function cardHTML(item) {
    const title = escapeHTML(item.title || item.filename || item.url || '未命名资源');
    const desc = escapeHTML(item.description || '');
    const date = formatDate(item.createdAt);
    const kind = item.type === 'link' ? '链接' : item.type === 'image' ? '图片' : '文件';
    let preview = '';
    let footer = '';
    if (item.type === 'image') {
      const url = getObjectUrl(item);
      preview = `<div class="preview"><img src="${escapeHTML(url)}" alt="${title}" data-preview-id="${escapeHTML(item.id)}" loading="lazy"><span class="preview-badge">IMAGE</span><div class="card-menu"><button class="icon-btn delete-btn" data-delete-id="${escapeHTML(item.id)}" aria-label="删除${title}" title="删除资源">${svg.trash}</button></div></div>`;
      footer = `<div class="file-meta">${svg.image}<span>${escapeHTML(item.filename || '图片')}</span><span>·</span><span>${formatSize(item.size)}</span></div>`;
    } else if (item.type === 'file') {
      preview = `<div class="preview"><div class="preview-placeholder"><div class="file-symbol">${svg.file}</div></div><span class="preview-badge">FILE</span><div class="card-menu"><button class="icon-btn delete-btn" data-delete-id="${escapeHTML(item.id)}" aria-label="删除${title}" title="删除资源">${svg.trash}</button></div></div>`;
      footer = `<div class="file-meta">${svg.file}<span>${escapeHTML(item.filename || '文件')}</span><span>·</span><span>${formatSize(item.size)}</span><a class="download-link" href="${escapeHTML(getObjectUrl(item))}" download="${escapeHTML(item.filename || item.title || 'download')}">${svg.download} 下载</a></div>`;
    } else {
      let hostname = '';
      try { hostname = new URL(item.url).hostname.replace(/^www\./, ''); } catch (_) { hostname = item.url || ''; }
      const firstLetter = escapeHTML((hostname || '↗').slice(0,1).toUpperCase());
      preview = `<div class="preview"><div class="preview-placeholder"><div style="z-index:1;text-align:center;padding:15px"><div class="file-symbol" style="width:58px;height:58px;border-radius:18px">${svg.link}</div><div style="font-size:12px;font-weight:800;color:#5d765f;margin-top:12px">LINK SAVED</div></div></div><span class="preview-badge">LINK</span><div class="card-menu"><button class="icon-btn delete-btn" data-delete-id="${escapeHTML(item.id)}" aria-label="删除${title}" title="删除资源">${svg.trash}</button></div></div>`;
      footer = `<div class="url-line"><span class="favicon">${firstLetter}</span><span class="url-text" title="${escapeHTML(item.url)}">${escapeHTML(hostname)}</span><a class="open-link" href="${escapeHTML(item.url)}" target="_blank" rel="noopener noreferrer">打开 ↗</a></div>`;
    }
    const typeIcon = svg[item.type] || svg.file;
    return `<article class="card" data-id="${escapeHTML(item.id)}">${preview}<div class="card-body"><div class="type-line"><span class="type-tag">${typeIcon}${kind}</span><span class="date">${date}</span></div><h3 class="card-title">${title}</h3><p class="card-desc">${desc}</p>${footer}</div></article>`;
  }
  function render() {
    stats();
    const query = $('searchInput').value.trim().toLowerCase();
    const sort = $('sortSelect').value;
    let visible = items.filter(item => {
      const matchesType = activeFilter === 'all' || item.type === activeFilter;
      const searchable = [item.title, item.description, item.url, item.filename].join(' ').toLowerCase();
      return matchesType && (!query || searchable.includes(query));
    });
    visible.sort((a,b) => sort === 'old' ? a.createdAt-b.createdAt : sort === 'az' ? (a.title || a.filename || a.url || '').localeCompare(b.title || b.filename || b.url || '', 'zh-CN') : b.createdAt-a.createdAt);
    $('resultTitle').textContent = query ? `搜索结果（${visible.length}）` : ({all:'所有资源',link:'网址链接',image:'图片收藏',file:'文件收藏'}[activeFilter]);
    $('resultNote').textContent = query ? `包含“${query}”的内容` : visible.length ? `当前显示 ${visible.length} 项，收集灵感，也收集效率。` : '这里还空着，放进第一份收藏吧。';
    const grid = $('resourceGrid');
    grid.classList.toggle('list-view', listView);
    if (!visible.length) {
      const isSearch = !!query;
      const heading = isSearch ? '没有找到相关内容' : (items.length === 0 ? '先收藏第一份资源吧' : '这个分类还空着');
      const message = isSearch ? '换个关键词试试，或者检查一下网址和文件名。' : '可以添加网址链接、图片或文件。你的灵感收纳盒，从这里开始。';
      grid.innerHTML = `<div class="empty"><div class="empty-icon">${isSearch ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg>' : svg.link}</div><h3>${heading}</h3><p>${message}</p>${isSearch ? '' : '<button class="btn btn-primary" id="emptyAdd"><span style="font-size:18px;line-height:12px">＋</span>添加第一项</button>'}</div>`;
      const emptyAdd = $('emptyAdd'); if (emptyAdd) emptyAdd.addEventListener('click', openModal);
      return;
    }
    grid.innerHTML = visible.map(cardHTML).join('');
    grid.querySelectorAll('[data-delete-id]').forEach(button => button.addEventListener('click', () => deleteResource(button.dataset.deleteId)));
    grid.querySelectorAll('[data-preview-id]').forEach(image => image.addEventListener('click', () => openLightbox(image.dataset.previewId)));
  }
  function chooseType(type) {
    activeType = type;
    document.querySelectorAll('.type-choice').forEach(btn => btn.classList.toggle('active', btn.dataset.type === type));
    const isLink = type === 'link';
    $('linkFields').classList.toggle('hidden', !isLink);
    $('uploadFields').classList.toggle('hidden', isLink);
    $('urlInput').required = isLink;
    $('fileInput').required = false; // 通过 selectedFiles 数组校验，避免清空 input value 后触发浏览器原生拦截
    $('fileInput').accept = type === 'image' ? 'image/*' : '';
    $('uploadLabel').textContent = type === 'image' ? '选择图片 *' : '选择文件 *';
    $('uploadHint').textContent = type === 'image' ? '支持常见图片格式，可一次选择多张' : '可一次选择多个文件，保存后可以下载';
    $('fileInput').value = '';
    selectedFiles = [];
    $('selectedFiles').textContent = '';
  }
  function openModal() {
    $('addOverlay').classList.add('show');
    document.body.style.overflow = 'hidden';
    chooseType('link');
    $('addForm').reset();
    $('selectedFiles').textContent = '';
    setTimeout(() => $('urlInput').focus({preventScroll:true}), 60);
  }
  function closeModal() { $('addOverlay').classList.remove('show'); document.body.style.overflow = ''; }
  function normalizeUrl(value) {
    let text = value.trim();
    if (!/^https?:\/\//i.test(text)) text = 'https://' + text;
    let url;
    try { url = new URL(text); } catch (_) { throw new Error('请输入有效的网址'); }
    if (!['http:', 'https:'].includes(url.protocol)) throw new Error('网址必须以 http:// 或 https:// 开头');
    return url.href;
  }
  function setFiles(files) {
    const array = Array.from(files || []);
    if (activeType === 'image') {
      const bad = array.filter(file => !file.type.startsWith('image/'));
      selectedFiles = array.filter(file => file.type.startsWith('image/'));
      if (bad.length) showToast('已跳过非图片文件');
    } else selectedFiles = array;
    $('fileInput').value = '';
    $('selectedFiles').textContent = selectedFiles.length ? `已选 ${selectedFiles.length} 个：\n` + selectedFiles.map(f => `• ${f.name}（${formatSize(f.size)}）`).join('\n') : '';
  }
  async function saveResource(event) {
    event.preventDefault();
    const description = $('descriptionInput').value.trim();
    const button = $('saveButton');
    button.disabled = true; button.textContent = '保存中…';
    try {
      if (activeType === 'link') {
        const url = normalizeUrl($('urlInput').value);
        let title = $('linkTitle').value.trim();
        if (!title) { try { title = new URL(url).hostname.replace(/^www\./, ''); } catch (_) { title = url; } }
        await putItem({id:uid(),type:'link',title,description,url,createdAt:Date.now()});
        await reloadItems(); closeModal(); showToast('链接已收入拾集');
      } else {
        if (!selectedFiles.length) throw new Error('请先选择' + (activeType === 'image' ? '图片' : '文件'));
        let savedCount = 0;
        for (const file of selectedFiles) {
          if (activeType === 'image' && !file.type.startsWith('image/')) continue;
          await putItem({id:uid(),type:activeType,title:file.name,description,filename:file.name,mime:file.type || 'application/octet-stream',size:file.size,blob:file,createdAt:Date.now()+savedCount});
          savedCount++;
        }
        await reloadItems(); closeModal(); showToast(`已保存 ${savedCount} 个${activeType === 'image' ? '图片' : '文件'}`);
      }
    } catch (error) {
      console.error(error);
      const message = error && error.name === 'QuotaExceededError' ? '浏览器可用空间不足，请删掉部分大文件后重试' : (error.message || '保存失败，请重试');
      showToast(message);
    } finally {
      button.disabled = false;
      button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>保存资源';
    }
  }
  async function reloadItems() {
    items = await getAll();
    items.sort((a,b) => b.createdAt - a.createdAt);
    render();
  }
  async function deleteResource(id) {
    const item = items.find(x => x.id === id);
    if (!item || !confirm(`确定删除「${item.title || item.filename || item.url}」吗？此操作无法撤销。`)) return;
    try {
      await removeItem(id);
      const url = objectUrls.get(id); if (url) { URL.revokeObjectURL(url); objectUrls.delete(id); }
      await reloadItems(); showToast('已删除这项资源');
    } catch (error) { showToast('删除失败，请重试'); }
  }
  function openLightbox(id) {
    const item = items.find(x => x.id === id); if (!item || !item.blob) return;
    $('lightboxImage').src = getObjectUrl(item);
    $('lightboxImage').alt = item.title || item.filename || '图片预览';
    $('lightbox').classList.add('show');
  }
  function closeLightbox() { $('lightbox').classList.remove('show'); $('lightboxImage').src = ''; }
  function showHelp() {
    alert('使用说明\n\n1. 点击「添加资源」，选择网址链接、图片或文件。\n2. 可通过搜索框查找标题、网址、备注和文件名。\n3. 图片点击可放大预览，文件可以下载，链接会在新标签页打开。\n4. 当前版本使用浏览器本地数据库保存内容，不会自动上传或同步到其他设备。\n5. 若要让其他人访问同一个共享资源库，需要部署服务器和后端存储。');
  }
  document.querySelectorAll('.tab[data-filter]').forEach(btn => btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.tab[data-filter]').forEach(b => { b.classList.toggle('active', b === btn); b.setAttribute('aria-selected', String(b === btn)); });
    render();
  }));
  document.querySelectorAll('.type-choice').forEach(btn => btn.addEventListener('click', () => chooseType(btn.dataset.type)));
  $('openAddTop').addEventListener('click', openModal);
  $('closeModal').addEventListener('click', closeModal);
  $('cancelModal').addEventListener('click', closeModal);
  $('addOverlay').addEventListener('click', event => { if (event.target === $('addOverlay')) closeModal(); });
  $('addForm').addEventListener('submit', saveResource);
  $('fileInput').addEventListener('change', event => setFiles(event.target.files));
  $('dropzone').addEventListener('dragover', event => { event.preventDefault(); $('dropzone').classList.add('dragover'); });
  $('dropzone').addEventListener('dragleave', () => $('dropzone').classList.remove('dragover'));
  $('dropzone').addEventListener('drop', event => { event.preventDefault(); $('dropzone').classList.remove('dragover'); if (event.dataTransfer && event.dataTransfer.files) setFiles(event.dataTransfer.files); });
  $('searchInput').addEventListener('input', render);
  $('sortSelect').addEventListener('change', render);
  $('gridMode').addEventListener('click', () => { listView = false; $('gridMode').classList.add('active'); $('listMode').classList.remove('active'); render(); });
  $('listMode').addEventListener('click', () => { listView = true; $('listMode').classList.add('active'); $('gridMode').classList.remove('active'); render(); });
  $('helpButton').addEventListener('click', showHelp);
  $('closeLightbox').addEventListener('click', closeLightbox);
  $('lightbox').addEventListener('click', event => { if (event.target === $('lightbox')) closeLightbox(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeModal(); closeLightbox(); } });
  $('year').textContent = new Date().getFullYear();
  openDB().then(reloadItems).catch(error => {
    console.error(error);
    $('resourceGrid').innerHTML = '<div class="empty"><div class="empty-icon">!</div><h3>无法打开本地资源库</h3><p>请使用较新的 Safari、Chrome 或 Edge 浏览器打开此网页。如果你直接在某些文件预览器里打开，请尝试在浏览器中打开。</p></div>';
    showToast('本地存储初始化失败，请尝试使用浏览器打开');
  });
})();
</script>
</body>
</html>
